name: Google Drive Manga OCR Pipeline

on:
  workflow_dispatch:
    inputs:
      folder_id:
        description: 'Google Drive Source Folder ID or URL'
        required: true
        default: '1dkgOWrSqT6QoVoF4r2S6BieA8ratVpqj'
      manga_name:
        description: 'Manga Title'
        required: false
        default: ''
      chapter_num:
        description: 'Chapter Number'
        required: false
        default: ''
      queue_id:
        description: 'WorkQueue Item ID'
        required: false
        default: ''
      doc_url:
        description: 'Google Docs Reference URL'
        required: false
        default: ''
      lang:
        description: 'OCR Language (ch / japan / korean / en)'
        required: true
        default: 'ch'
      source_url:
        description: 'Source or Original Platform URL (e.g. comix.to)'
        required: false
        default: ''
      manga_id:
        description: 'MangaHub ID'
        required: false
        default: ''
      reading_direction:
        description: 'Reading Direction (auto / ltr / rtl)'
        required: false
        default: 'auto'
      google_access_token:
        description: 'Google OAuth Access Token (passed from GAS)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  ocr-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies (CPU Optimized)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install paddlepaddle
          pip install paddleocr ultralytics gdown pillow opencv-python-headless requests google-api-python-client google-auth

      - name: Run Manga OCR & Upload .MTP + .TXT to Source Drive Folder
        env:
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_ACCESS_TOKEN: ${{ github.event.inputs.google_access_token }}
          PADDLE_PDX_ENABLE_MKLDNN_BYDEFAULT: "0"
          FLAGS_use_mkldnn: "0"
          FLAGS_enable_pir_api: "0"
          PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
        run: |
          python tools/gdrive_ocr_job.py \
            --folder-id "${{ github.event.inputs.folder_id }}" \
            --manga-name "${{ github.event.inputs.manga_name }}" \
            --chapter-num "${{ github.event.inputs.chapter_num }}" \
            --queue-id "${{ github.event.inputs.queue_id }}" \
            --doc-url "${{ github.event.inputs.doc_url }}" \
            --lang "${{ github.event.inputs.lang }}" \
            --source-url "${{ github.event.inputs.source_url }}" \
            --manga-id "${{ github.event.inputs.manga_id }}" \
            --reading-direction "${{ github.event.inputs.reading_direction || 'auto' }}" \
            --google-access-token "${{ github.event.inputs.google_access_token }}" \
            --output-dir "./ocr_output" \
            --upload-to-source

      - name: Upload Backup .MTP & .TXT to GitHub Artifacts
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: manga-ocr-output-${{ github.event.inputs.chapter_num || 'mtp' }}
          path: ocr_output/
          retention-days: 7

      - name: Clean Up Runner Workspace & Git Working Tree
        if: always()
        run: |
          echo "🧹 Cleaning up downloaded raw images and local OCR files..."
          rm -rf downloaded_manga ocr_output __pycache__ .pytest_cache
          git clean -fdx -e models/best.pt
          echo "✓ Git working tree cleaned:"
          git status
