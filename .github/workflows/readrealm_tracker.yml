name: Multi-Platform 6-Hour Growth Tracker Pipeline (ReadRealm + Kairew + Chaply)

on:
  # รันอัตโนมัติทุกๆ 6 ชั่วโมง (และรองรับการสั่งรันจาก Google Apps Script 6h Trigger)
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform (all, readrealm, kairew, chaply)'
        required: false
        default: 'all'
      force_refresh:
        description: 'Force refresh tokens (true/false)'
        required: false
        default: 'false'

concurrency:
  group: multi-platform-growth-tracker-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  track-growth:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt requests
          playwright install --with-deps chromium

      - name: Run Multi-Platform Growth Tracker Engine
        env:
          PYTHONUNBUFFERED: '1'
          READREALM_USER_1: ${{ secrets.READREALM_USER_1 || 'lionking20130@gmail.com' }}
          READREALM_PASS_1: ${{ secrets.READREALM_PASS_1 || 'aDOPifen01@' }}
          READREALM_USER_2: ${{ secrets.READREALM_USER_2 || 'adieu2547' }}
          READREALM_PASS_2: ${{ secrets.READREALM_PASS_2 || 'alone2548' }}
          KAIREW_USER: ${{ secrets.KAIREW_USER || '0886172880' }}
          KAIREW_PASS: ${{ secrets.KAIREW_PASS || 'poom112345ad' }}
          CHAPLY_USER: ${{ secrets.CHAPLY_USER || 'kuroko11.p.g@gmail.com' }}
          CHAPLY_PASS: ${{ secrets.CHAPLY_PASS || '@Poom112345ad' }}
          GAS_URL: ${{ secrets.GAS_URL || 'https://script.google.com/macros/s/AKfycbzG1H1eBoTsF7Omfso8v23N6HidWXU4kS-yyf0xDunb2BoZgPiUYPIOO2vMLSvYWwHsnw/exec' }}
          PASSCODE: ${{ secrets.PASSCODE || '10211032' }}
        run: |
          python tools/multi_platform_tracker.py --platform "${{ github.event.inputs.platform || 'all' }}" --send-gas

      - name: Commit & Push Historical Snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/data/*_history.json tools/data/*_growth_latest.json frontend/public/data/*_growth_latest.json frontend/src/data/*_growth_latest.json
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(tracker): update multi-platform 6h sales & views snapshots [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi
