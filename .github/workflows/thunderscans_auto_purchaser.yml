name: ThunderScans (en-thunder) 24/7 Pipeline (5-Min Cooldown)

on:
  schedule:
    # รันอัตโนมัติตลอด 24 ชั่วโมง ทุกๆ ต้นชั่วโมง (นาทีที่ 0 ของทุกชั่วโมง)
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      chapter_url:
        description: 'Specific Chapter URL to process (leave empty for all pending)'
        required: false
        default: ''
      max_chapters:
        description: 'Maximum chapters to process (0 = all pending chapters)'
        required: false
        default: '0'
      cooldown_seconds:
        description: 'Cooldown delay between chapters in seconds (default: 300 = 5 minutes)'
        required: false
        default: '300'

concurrency:
  group: raw-pipeline-master-queue
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  thunderscans-pipeline:
    name: ThunderScans 24/7 Auto-Purchaser (5-Min Delay)
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ThunderScans 24/7 Pipeline
        env:
          PYTHONUNBUFFERED: '1'
          GAS_URL: ${{ secrets.GAS_URL || 'https://script.google.com/macros/s/AKfycbzG1H1eBoTsF7Omfso8v23N6HidWXU4kS-yyf0xDunb2BoZgPiUYPIOO2vMLSvYWwHsnw/exec' }}
          PASSCODE: ${{ secrets.PASSCODE || '10211032' }}
          THUNDERSCANS_COOKIE: ${{ secrets.THUNDERSCANS_COOKIE || '' }}
          COOLDOWN_SECONDS: ${{ github.event.inputs.cooldown_seconds || '300' }}
          THUNDERSCANS_COOLDOWN_SECONDS: ${{ github.event.inputs.cooldown_seconds || '300' }}
          MAX_CHAPTERS: ${{ github.event.inputs.max_chapters || '0' }}
        run: |
          CHAPTER_URL="${{ github.event.inputs.chapter_url }}"
          if [ -n "$CHAPTER_URL" ]; then
            echo "🎯 Processing single chapter: $CHAPTER_URL"
            python tools/thunderscans_purchaser.py "$CHAPTER_URL"
          else
            echo "📋 Processing all pending ThunderScans chapters (5-min delay between chapters)..."
            python tools/thunderscans_purchaser.py --run-all
          fi
