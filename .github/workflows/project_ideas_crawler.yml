name: New Project Ideas Crawler (Mgeko & Comix.to <= 100 Chapters)

on:
  workflow_dispatch:
    inputs:
      pages:
        description: 'Number of pages to scan sequentially (1-30)'
        required: false
        default: '30'
      max_chapters:
        description: 'Maximum chapter count threshold'
        required: false
        default: '100'

concurrency:
  group: mgeko-project-ideas-crawler
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  crawl-ideas:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests lxml pillow

      - name: Run Project Ideas Crawler (Mgeko + Comix.to Fresh Crawl)
        run: |
          python tools/mgeko_project_ideas_crawler.py --pages "${{ github.event.inputs.pages || '30' }}" --max-chapters "${{ github.event.inputs.max_chapters || '100' }}" --send-gas
        env:
          GAS_URL: ${{ secrets.GAS_URL }}
          PASSCODE: ${{ secrets.PASSCODE }}

      - name: Commit & Push New Project Ideas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/data/project_ideas_latest.json tools/data/comix_project_ideas_latest.json tools/data/translation_cache.json frontend/public/data/project_ideas_latest.json frontend/public/data/comix_project_ideas_latest.json frontend/src/data/project_ideas_latest.json frontend/src/data/comix_project_ideas_latest.json
          if git diff --staged --quiet; then
            echo "No new project ideas changes to commit."
          else
            git commit -m "chore(ideas): fresh crawl Mgeko & Comix.to <= 100 chapters and overwrite sheet [skip ci]"
            git push origin main
          fi
